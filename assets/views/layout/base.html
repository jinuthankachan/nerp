<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}nERP{% endblock %}</title>

    <!-- Tabler + Tabler Icons + nERP styles, bundled by Vite → assets/static/dist -->
    <link rel="stylesheet" href="/static/dist/app.css" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="page">
      {% block body %}
      <header class="navbar navbar-expand-md d-print-none">
        <div class="container-xl">
          <a href="/" class="navbar-brand fw-bold fs-2 text-primary">
            <i class="ti ti-circles-relation me-1"></i>nERP
          </a>
        </div>
      </header>
      <div class="page-wrapper">
        <div class="page-body">
          <div class="container-xl">
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
      {% endblock %}
    </div>

    <!-- htmx + Tabler + nERP JS, bundled by Vite (ES module) -->
    <script type="module" src="/static/dist/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
